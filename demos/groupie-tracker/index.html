<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Groupie Tracker — interactive demo running on an API data snapshot.">
    <title>Groupie Tracker — Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* demo-only bar (kept visually close to the app) */
        .demo-note {
            max-width: 1100px; margin: 10px auto 0; padding: 10px 20px;
            font-size: .8rem; color: #b8b209; color: #a79c8c; text-align: center;
        }
        .demo-note b { color: #e94560; }
        .back-inline { display: none; padding: 4px 0; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="#" class="logo" id="logo-link">
                <span class="logo-icon">🎵</span>
                <span class="logo-text">Groupie Tracker</span>
            </a>
        </div>
    </header>

    <main class="container" id="main">
        <!-- Search block -->
        <section class="search-block" id="home-view">
            <h2 class="search-title">Discover Artists &amp; Bands</h2>
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="search-input" placeholder="Search by artist name..." autocomplete="off" aria-label="Search artists">
            </div>
            <div id="artists-grid" class="cards-grid"></div>
            <div id="no-results" class="no-results" style="display:none;">
                <p>🔍 No artists found matching your search.</p>
            </div>
        </section>

        <!-- Artist detail -->
        <section id="artist-view" style="display:none;"></section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 Groupie Tracker &mdash; interactive demo running on an API data snapshot.</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="demo.js"></script>
</body>
</html>
